<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Band Room — 합주실 예약</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🎸</span>
      <span class="logo-text">Band Room</span>
    </div>
    <div class="header-actions">
      <button class="header-link" onclick="openInquiryModal()" aria-label="문의/신고">📩 문의·신고</button>
    </div>
  </header>

  <main class="main">

    <!-- Date Navigation -->
    <div class="date-nav">
      <div class="date-top">
        <button class="btn-nav" id="prevDay" aria-label="이전 날">&#8249;</button>
        <div class="date-center">
          <span class="date-weekday" id="weekday"></span>
          <span class="date-text" id="currentDate"></span>
        </div>
        <button class="btn-nav" id="nextDay" aria-label="다음 날">&#8250;</button>
      </div>
      <div class="week-strip" id="weekStrip"></div>
    </div>

    <!-- Room Tabs (filled from /api/rooms) -->
    <div class="room-tabs" id="roomTabs"></div>

    <!-- Timeline -->
    <div class="timeline-section" id="timelineSection">
      <div class="timeline-wrapper">
        <div class="time-labels" id="timeLabels"></div>
        <div class="timeline-grid" id="timelineGrid">
          <!-- slots injected by JS -->
          <div class="reservations-layer" id="reservationsLayer"></div>
          <div class="current-time-line" id="currentTimeLine" style="display:none"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <button class="btn-reserve-main" onclick="openModal()">
      <span>+</span> 예약하기
    </button>
  </div>

  <!-- Reservation Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3 class="modal-title">예약하기</h3>
        <button class="modal-close" onclick="closeModal()" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">
        <form id="reservationForm" autocomplete="off">

          <!-- Room Badge -->
          <div id="roomBadge" class="room-badge r1">
            <span class="badge-dot"></span>
            <span id="roomBadgeName">합주실</span>
          </div>

          <!-- Start Time -->
          <div class="form-group">
            <label class="form-label" for="startTime">시작 시간</label>
            <select class="form-select" id="startTime"></select>
          </div>

          <!-- End Time -->
          <div class="form-group">
            <label class="form-label" for="endTime">종료 시간</label>
            <select class="form-select" id="endTime"></select>
          </div>

          <!-- Time Summary -->
          <div class="time-summary">
            <span class="time-summary-icon">🕐</span>
            <span class="time-summary-text" id="timeSummaryText">—</span>
          </div>
          <div class="time-max-hint" id="timeMaxHint"></div>

          <!-- Team -->
          <div class="form-group">
            <label class="form-label" for="teamSelect">
              예약 팀 <span style="color:var(--danger)">*</span>
            </label>
            <select class="form-select" id="teamSelect" required>
              <option value="">팀을 선택하세요</option>
            </select>
            <button type="button" class="link-inline" onclick="closeModal(); openInquiryModal();">
              팀이 목록에 없나요? 문의하기 →
            </button>
          </div>

          <!-- Members -->
          <div class="form-group">
            <label class="form-label" for="members">
              참여 멤버
              <span style="color:var(--text-light);font-weight:500;text-transform:none;letter-spacing:0">(선택)</span>
            </label>
            <input type="text" class="form-input" id="members"
              placeholder="홍길동, 김철수, 이영희">
          </div>

          <!-- Note -->
          <div class="form-group">
            <label class="form-label" for="note">
              메모
              <span style="color:var(--text-light);font-weight:500;text-transform:none;letter-spacing:0">(선택)</span>
            </label>
            <textarea class="form-textarea" id="note"
              placeholder="특이사항이 있다면 적어주세요"></textarea>
          </div>

          <!-- 선불 팀(월 이용료 · 월회비)은 건별 요금이 없어 요금 박스를 통째로 감춘다 -->
          <div class="prepaid-note" id="prepaidNote" style="display:none;"></div>

          <!-- Fee & Deposit Info -->
          <div class="fee-box" id="feeBox">
            <div class="fee-row">
              <span class="fee-label">이용 요금</span>
              <span class="fee-value" id="feeAmount">—</span>
            </div>
            <div class="fee-breakdown" id="feeBreakdown">시간당 요금 안내</div>
            <div id="feeDepositBox">
              <div class="fee-divider"></div>
              <div class="fee-deposit-title">입금 계좌</div>
              <div class="fee-deposit">
                <div class="fee-deposit-bank" id="depositBank"></div>
                <div class="fee-deposit-name" id="depositHolder"></div>
                <button type="button" class="btn-copy-account" id="copyAccountBtn">계좌번호 복사</button>
              </div>
            </div>
            <div class="fee-notice" id="feeNotice">입금 확인 후 예약이 확정됩니다.</div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">예약 신청</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Inquiry Modal -->
  <div class="modal-overlay" id="inquiryOverlay">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3 class="modal-title">문의·신고</h3>
        <button class="modal-close" onclick="closeInquiryModal()" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">
        <form id="inquiryForm" autocomplete="off">

          <div class="form-group">
            <label class="form-label">유형 <span style="color:var(--danger)">*</span></label>
            <div class="inquiry-cats">
              <label class="inquiry-cat active">
                <input type="radio" name="inqCat" value="question" checked>
                <span class="inquiry-cat-icon">💬</span>
                <span class="inquiry-cat-name">문의</span>
              </label>
              <label class="inquiry-cat">
                <input type="radio" name="inqCat" value="complaint">
                <span class="inquiry-cat-icon">🛠</span>
                <span class="inquiry-cat-name">불편사항</span>
              </label>
              <label class="inquiry-cat">
                <input type="radio" name="inqCat" value="incident">
                <span class="inquiry-cat-icon">⚠️</span>
                <span class="inquiry-cat-name">사고 접수</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="inqContent">내용 <span style="color:var(--danger)">*</span></label>
            <textarea class="form-textarea" id="inqContent"
              placeholder="상세 내용을 적어주세요" maxlength="2000" required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="inqName">
              이름
              <span style="color:var(--text-light);font-weight:500;text-transform:none;letter-spacing:0">(선택)</span>
            </label>
            <input type="text" class="form-input" id="inqName" placeholder="홍길동" maxlength="100">
          </div>

          <div class="form-group">
            <label class="form-label" for="inqPhone">
              연락처
              <span style="color:var(--text-light);font-weight:500;text-transform:none;letter-spacing:0">(선택 · 회신이 필요한 경우)</span>
            </label>
            <input type="tel" class="form-input" id="inqPhone" placeholder="010-0000-0000" maxlength="30">
          </div>

          <button type="submit" class="btn-submit" id="inqSubmitBtn">접수하기</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
